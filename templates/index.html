<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AudioStitcher</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; padding-bottom: 80px; }
h1 { padding: 16px 24px 8px; font-size: 20px; color: #fff; }

/* Toolbar */
.toolbar {
  padding: 8px 24px 16px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  border-bottom: 1px solid #333;
}
.toolbar label { font-size: 13px; color: #aaa; }
.toolbar input[type=range] { width: 140px; vertical-align: middle; }
.toolbar button {
  padding: 6px 16px; border: none; border-radius: 4px;
  cursor: pointer; font-size: 13px; font-weight: 600;
}
.btn-primary { background: #4a7fff; color: #fff; }
.btn-primary:hover { background: #3a6fee; }
.btn-secondary { background: #444; color: #ddd; }
.btn-secondary:hover { background: #555; }
.btn-success { background: #2ea043; color: #fff; }
.btn-success:hover { background: #238636; }
.btn-danger { background: #d32f2f; color: #fff; }
.btn-danger:hover { background: #b71c1c; }
.btn-sm { padding: 4px 10px; font-size: 12px; }

/* Info bar */
.info-bar {
  padding: 8px 24px; font-size: 12px; color: #888;
  display: flex; gap: 24px;
}

/* Timeline */
.timeline-container { padding: 16px 24px; overflow-x: auto; }
.timeline {
  display: flex; gap: 2px; min-width: max-content;
  height: 80px; align-items: flex-end;
}
.seg-block {
  cursor: pointer; border-radius: 3px 3px 0 0;
  display: flex; align-items: flex-end; justify-content: center;
  font-size: 10px; color: rgba(255,255,255,0.7);
  padding-bottom: 4px; transition: all 0.15s;
  position: relative; min-width: 12px;
}
.seg-block:hover { filter: brightness(1.3); transform: translateY(-2px); }
.seg-block.selected { outline: 2px solid #fff; outline-offset: 1px; }
.seg-block.in-range { outline: 2px solid #888; outline-offset: 1px; }
.seg-block.playing { outline: 2px solid #ffeb3b; outline-offset: 1px; }
.seg-block.cut {
  background: #333 !important; opacity: 0.5;
  border: 1px dashed #9c27b0;
}
.seg-block.cut::after {
  content: ''; position: absolute; top: 2px; right: 2px;
  width: 6px; height: 6px; border-radius: 50%; background: #9c27b0;
}
.seg-block.patched::after {
  content: ''; position: absolute; top: 2px; right: 2px;
  width: 6px; height: 6px; border-radius: 50%; background: #4a7fff;
}

/* Detail panel */
.detail-panel {
  margin: 0 24px; padding: 20px;
  background: #16213e; border-radius: 8px;
  display: none;
}
.detail-panel.visible { display: block; }
.detail-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px;
}
.detail-header h2 { font-size: 16px; }
.detail-header .time { color: #888; font-size: 13px; }

.issues-list { margin-bottom: 16px; }
.issue-row {
  display: flex; align-items: center; gap: 12px;
  padding: 4px 0; font-size: 13px;
}
.issue-type {
  display: inline-block; padding: 2px 8px; border-radius: 3px;
  font-size: 11px; font-weight: 600; text-transform: uppercase; min-width: 80px; text-align: center;
}
.issue-type.timing { background: #b8860b33; color: #daa520; }
.issue-type.hesitation { background: #ff634733; color: #ff6347; }
.issue-type.wrong_note { background: #ff149333; color: #ff1493; }
.issue-type.noise { background: #8b000033; color: #cd5c5c; }
.issue-type.clipping { background: #ff000033; color: #ff4444; }
.issue-type.false_start { background: #9c27b033; color: #ce93d8; }
.severity-bar {
  width: 60px; height: 6px; background: #333; border-radius: 3px; overflow: hidden;
}
.severity-fill { height: 100%; border-radius: 3px; }

/* Take comparison grid */
.take-grid { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.take-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; border-radius: 6px;
  background: #1a1a2e; border: 1px solid #333;
}
.take-row.is-base { border-color: #2ea04366; }
.take-row.is-active { border-color: #4a7fff; background: #4a7fff15; }
.take-name { min-width: 120px; font-size: 13px; }
.take-name .badge {
  font-size: 10px; padding: 1px 6px; border-radius: 3px;
  margin-left: 6px; vertical-align: middle;
}
.badge-base { background: #2ea04333; color: #2ea043; }
.badge-active { background: #4a7fff33; color: #4a7fff; }
.take-actions { display: flex; gap: 6px; margin-left: auto; }

/* Playback bar */
.playback-bar {
  padding: 12px 24px;
  display: flex; align-items: center; gap: 12px;
  border-top: 1px solid #333;
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #1a1a2e; z-index: 10;
}
.playback-bar select {
  background: #333; color: #e0e0e0; border: 1px solid #555;
  padding: 6px 8px; border-radius: 4px; font-size: 13px;
}
#playback-position { color: #888; font-size: 13px; min-width: 100px; text-align: right; }
#playback-slider { flex: 1; }
</style>
</head>
<body>

<h1>AudioStitcher</h1>

<div class="toolbar">
  <label>Auto-patch threshold:
    <input type="range" id="threshold-slider" min="0" max="1" step="0.05" value="0.3">
    <span id="threshold-value">0.30</span>
  </label>
  <button class="btn-primary" onclick="autoPatch()">Auto-patch</button>
  <button class="btn-secondary" onclick="clearPatches()">Clear all patches</button>
  <button class="btn-success" onclick="exportComposite()">Export composite</button>
</div>

<div class="info-bar" id="info-bar"></div>

<div class="timeline-container">
  <div class="timeline" id="timeline"></div>
</div>

<div class="detail-panel" id="detail-panel">
  <div class="detail-header">
    <h2 id="detail-title"></h2>
    <span class="time" id="detail-time"></span>
  </div>
  <div class="issues-list" id="issues-list"></div>
  <div id="speed-control" style="display:none;margin-bottom:12px"></div>
  <div id="take-grid-container"></div>
</div>

<div class="playback-bar">
  <button class="btn-secondary" onclick="togglePlayback()" id="play-btn">Play</button>
  <select id="playback-source"></select>
  <input type="range" id="playback-slider" min="0" max="100" value="0" step="0.1">
  <span id="playback-position">0:00 / 0:00</span>
</div>

<script>
let project = null;
let selectedSeg = null;    // primary selected segment (end of range)
let rangeStart = null;     // start of multi-select range (null = single selection)
let playingSeg = null;     // segment highlighted during full playback

// Audio state
let segmentAudio = null;  // for segment preview
let fullAudio = null;     // for full take playback
let fullAudioTakeIdx = null;
let fullAudioIsComposite = false;

async function loadProject() {
  const resp = await fetch('/api/project');
  project = await resp.json();
  renderTimeline();
  renderInfo();
  renderPlaybackSource();
}

function renderInfo() {
  const base = project.takes.find(t => t.is_base);
  const patchCount = project.segments.filter(s => s.patch).length;
  const issueCount = project.segments.filter(s => s.issues.length > 0).length;
  document.getElementById('info-bar').innerHTML =
    `<span>Base: <b>${base.name}</b> (${base.duration.toFixed(1)}s, ${base.tempo.toFixed(0)} BPM)</span>` +
    `<span>Segments: <b>${project.segments.length}</b></span>` +
    `<span>Issues: <b>${issueCount}</b></span>` +
    `<span>Patches: <b>${patchCount}</b></span>` +
    `<span>Takes: <b>${project.takes.length}</b></span>`;
}

function renderPlaybackSource() {
  const sel = document.getElementById('playback-source');
  sel.innerHTML = '<option value="composite">Composite (with patches)</option>';
  project.takes.forEach(t => {
    const label = t.name + (t.is_base ? ' (base)' : '');
    sel.innerHTML += `<option value="${t.index}">${label}</option>`;
  });
}

function severityColor(severity) {
  if (severity === 0) return '#2ea043';
  if (severity < 0.3) return '#5a8a3c';
  if (severity < 0.5) return '#b8860b';
  if (severity < 0.7) return '#e07020';
  return '#d32f2f';
}

function renderTimeline() {
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';
  const maxDur = Math.max(...project.segments.map(s => s.duration));

  const rStart = getSelectionStart();
  const rEnd = getSelectionEnd();

  project.segments.forEach(seg => {
    const block = document.createElement('div');
    let cls = 'seg-block';
    if (seg.cut) cls += ' cut';
    else if (seg.patch) cls += ' patched';
    if (seg.index === selectedSeg) cls += ' selected';
    else if (rStart !== null && seg.index >= rStart && seg.index <= rEnd) cls += ' in-range';
    if (playingSeg === seg.index) cls += ' playing';
    block.className = cls;

    const width = Math.max(12, (seg.duration / maxDur) * 40);
    const height = seg.cut ? 20 : (seg.issues.length > 0 ? 20 + (seg.max_severity * 60) : 20);
    const color = seg.cut ? '#333' : (seg.issues.length > 0 ? severityColor(seg.max_severity) : '#2a4a2a');
    block.style.width = width + 'px';
    block.style.height = height + 'px';
    block.style.background = color;
    block.title = seg.cut
      ? `${seg.label} (CUT - false start)`
      : `${seg.label} (${seg.start.toFixed(1)}-${seg.end.toFixed(1)}s)` +
        (seg.issues.length ? '\n' + seg.issues.map(i => i.type + ': ' + i.description).join('\n') : '') +
        (seg.patch ? '\nPatched: ' + project.takes[seg.patch.take_index].name : '');
    block.textContent = seg.index;
    block.onclick = (e) => selectSegment(seg.index, e.shiftKey);
    block.id = 'seg-' + seg.index;
    tl.appendChild(block);
  });
}

function getSelectionStart() {
  if (rangeStart === null) return selectedSeg;
  return Math.min(rangeStart, selectedSeg);
}

function getSelectionEnd() {
  if (rangeStart === null) return selectedSeg;
  return Math.max(rangeStart, selectedSeg);
}

function isRangeSelection() {
  return rangeStart !== null && rangeStart !== selectedSeg;
}

function selectSegment(idx, shiftKey) {
  if (shiftKey && selectedSeg !== null) {
    // Extend range from the anchor (rangeStart or previous selectedSeg)
    if (rangeStart === null) rangeStart = selectedSeg;
    selectedSeg = idx;
  } else {
    // Single selection
    rangeStart = null;
    selectedSeg = idx;
  }
  renderTimeline();
  renderDetail();
  const el = document.getElementById('seg-' + idx);
  if (el) el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

function renderDetail() {
  if (selectedSeg === null) return;
  const panel = document.getElementById('detail-panel');
  panel.classList.add('visible');

  const rStart = getSelectionStart();
  const rEnd = getSelectionEnd();
  const isRange = isRangeSelection();
  const segs = project.segments.filter(s => s.index >= rStart && s.index <= rEnd);
  const firstSeg = segs[0];
  const lastSeg = segs[segs.length - 1];
  const totalDuration = lastSeg.end - firstSeg.start;

  // Header
  if (isRange) {
    document.getElementById('detail-title').textContent =
      `${firstSeg.label} - ${lastSeg.label} (${segs.length} segments)`;
  } else {
    document.getElementById('detail-title').textContent = firstSeg.label;
  }
  document.getElementById('detail-time').textContent =
    `${firstSeg.start.toFixed(2)}s - ${lastSeg.end.toFixed(2)}s (${totalDuration.toFixed(2)}s)`;

  // Issues (collect from all segments in range)
  const allIssues = segs.flatMap(s => s.issues.map(i => ({...i, segLabel: s.label})));
  const issuesEl = document.getElementById('issues-list');
  if (allIssues.length === 0) {
    issuesEl.innerHTML = '<div style="color:#666;font-size:13px;margin-bottom:8px">No issues detected</div>';
  } else {
    issuesEl.innerHTML = allIssues.map(issue => {
      const sevPct = (issue.severity * 100).toFixed(0);
      const color = severityColor(issue.severity);
      const prefix = isRange ? `<span style="color:#888;font-size:11px">${issue.segLabel}</span> ` : '';
      return `<div class="issue-row">
        ${prefix}
        <span class="issue-type ${issue.type}">${issue.type}</span>
        <div class="severity-bar"><div class="severity-fill" style="width:${sevPct}%;background:${color}"></div></div>
        <span>${issue.description}</span>
      </div>`;
    }).join('');
  }

  // Speed control
  const speedEl = document.getElementById('speed-control');
  const nonCutSegs = segs.filter(s => !s.cut);
  if (nonCutSegs.length > 0) {
    const speeds = nonCutSegs.map(s => s.speed_adjust || 0);
    const allSame = speeds.every(v => v === speeds[0]);
    const currentSpeed = allSame ? speeds[0] : null;
    const displayVal = currentSpeed !== null ? (currentSpeed > 0 ? '+' : '') + currentSpeed.toFixed(1) + '%' : 'mixed';
    speedEl.style.display = 'flex';
    speedEl.style.alignItems = 'center';
    speedEl.style.gap = '8px';
    speedEl.style.fontSize = '13px';
    speedEl.innerHTML =
      `<span style="color:#aaa">Speed:</span>` +
      `<button class="btn-secondary btn-sm" onclick="adjustSpeed(${rStart}, ${rEnd}, -1)">-1%</button>` +
      `<span style="min-width:50px;text-align:center;font-weight:600;color:${currentSpeed === 0 || currentSpeed === null ? '#888' : '#4a7fff'}">${displayVal}</span>` +
      `<button class="btn-secondary btn-sm" onclick="adjustSpeed(${rStart}, ${rEnd}, +1)">+1%</button>` +
      (currentSpeed !== 0 ? `<button class="btn-secondary btn-sm" onclick="setSpeed(${rStart}, ${rEnd}, 0)">Reset</button>` : '');
  } else {
    speedEl.style.display = 'none';
  }

  // Take grid — only for non-cut segments
  const container = document.getElementById('take-grid-container');
  const patchableSegs = segs.filter(s => !s.cut);
  // Show cut toggle for any segment that is cut or has a false_start issue
  const cutSegs = segs.filter(s => s.cut);
  const falseStartSegs = segs.filter(s => s.issues.some(i => i.type === 'false_start'));
  if (cutSegs.length > 0 || falseStartSegs.length > 0) {
    const cutIndices = [...new Set([...cutSegs, ...falseStartSegs].map(s => s.index))];
    let cutHtml = '<div style="margin-top:12px;margin-bottom:12px">';
    cutIndices.forEach(idx => {
      const s = project.segments.find(x => x.index === idx);
      const label = isRange ? `${s.label}: ` : '';
      if (s.cut) {
        cutHtml += `<div style="color:#9c27b0;font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:4px">` +
          `<span>${label}Marked as false start (will be cut)</span>` +
          `<button class="btn-secondary btn-sm" onclick="toggleCut(${idx}, false)">Restore segment</button></div>`;
      } else {
        cutHtml += `<div style="color:#888;font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:4px">` +
          `<span>${label}Detected as false start (kept)</span>` +
          `<button class="btn-danger btn-sm" onclick="toggleCut(${idx}, true)">Cut segment</button></div>`;
      }
    });
    cutHtml += '</div>';
    container.innerHTML = cutHtml;
  } else {
    container.innerHTML = '';
  }

  if (patchableSegs.length === 0) {
    // No take grid needed — all segments are cut
    return;
  } else {
    // For range patching, use the full range but patching only applies to non-cut segments
    const pStart = patchableSegs[0].index;
    const pEnd = patchableSegs[patchableSegs.length - 1].index;
    container.innerHTML += '<div class="take-grid">' + project.takes.map(take => {
      const isBase = take.is_base;
      const allUseThis = patchableSegs.every(s =>
        (take.index === project.base_idx && !s.patch) ||
        (s.patch && s.patch.take_index === take.index));
      let cls = 'take-row';
      if (isBase) cls += ' is-base';
      if (allUseThis) cls += ' is-active';

      let badges = '';
      if (isBase) badges += '<span class="badge badge-base">BASE</span>';
      if (allUseThis) badges += '<span class="badge badge-active">ACTIVE</span>';

      let actionBtn = '';
      if (allUseThis && !isBase) {
        actionBtn = `<button class="btn-danger btn-sm" onclick="removePatchRange(${pStart}, ${pEnd})">Revert to base</button>`;
      } else if (!allUseThis) {
        actionBtn = `<button class="btn-primary btn-sm" onclick="setPatchRange(${pStart}, ${pEnd}, ${take.index})">Use this</button>`;
      }

      return `<div class="${cls}">
        <span class="take-name">${take.name}${badges}</span>
        <button class="btn-secondary btn-sm" onclick="playRange(${pStart}, ${pEnd}, ${take.index})">Listen</button>
        ${actionBtn}
      </div>`;
    }).join('') + '</div>';
  }
}

// --- Cut toggle ---
async function toggleCut(segIdx, cut) {
  await fetch('/api/cut', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({segment_index: segIdx, cut: cut}),
  });
  invalidateFullAudio();
  await loadProject();
  renderDetail();
}

// --- Speed adjustment ---
async function adjustSpeed(startSeg, endSeg, delta) {
  // Get current speed from the first non-cut segment in range
  const segs = project.segments.filter(s => s.index >= startSeg && s.index <= endSeg && !s.cut);
  if (!segs.length) return;
  const current = segs[0].speed_adjust || 0;
  await setSpeed(startSeg, endSeg, current + delta);
}

async function setSpeed(startSeg, endSeg, speed) {
  await fetch('/api/speed', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({start_segment: startSeg, end_segment: endSeg, speed: speed}),
  });
  invalidateFullAudio();
  await loadProject();
  renderDetail();
}

// --- Audio preview (single segment or range) ---
function playRange(startSeg, endSeg, takeIdx) {
  if (segmentAudio) { segmentAudio.pause(); segmentAudio = null; }
  const url = startSeg === endSeg
    ? `/api/audio/segment/${startSeg}/${takeIdx}`
    : `/api/audio/range/${startSeg}/${endSeg}/${takeIdx}`;
  segmentAudio = new Audio(url);
  segmentAudio.play();
}

// --- Patch management (works for single or range) ---
async function setPatchRange(startSeg, endSeg, takeIdx) {
  await fetch('/api/patch_range', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({start_segment: startSeg, end_segment: endSeg, take_index: takeIdx}),
  });
  invalidateFullAudio();
  await loadProject();
  renderDetail();
}

async function removePatchRange(startSeg, endSeg) {
  await fetch('/api/patch_range', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({start_segment: startSeg, end_segment: endSeg, remove: true}),
  });
  invalidateFullAudio();
  await loadProject();
  renderDetail();
}

async function autoPatch() {
  const threshold = parseFloat(document.getElementById('threshold-slider').value);
  await fetch('/api/auto_patch', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({min_severity: threshold}),
  });
  invalidateFullAudio();
  await loadProject();
  if (selectedSeg !== null) renderDetail();
}

async function clearPatches() {
  const lastSeg = project.segments[project.segments.length - 1].index;
  await fetch('/api/patch_range', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({start_segment: 0, end_segment: lastSeg, remove: true}),
  });
  invalidateFullAudio();
  await loadProject();
  if (selectedSeg !== null) renderDetail();
}

// --- Full playback ---
function invalidateFullAudio() {
  // When patches change, the composite audio cache is stale
  if (fullAudioIsComposite && fullAudio) {
    fullAudio.pause();
    fullAudio = null;
    fullAudioTakeIdx = null;
    fullAudioIsComposite = false;
    document.getElementById('play-btn').textContent = 'Play';
  }
}

async function togglePlayback() {
  const btn = document.getElementById('play-btn');
  const sourceEl = document.getElementById('playback-source');
  const sourceVal = sourceEl.value;

  // If already playing, pause
  if (fullAudio && !fullAudio.paused) {
    fullAudio.pause();
    btn.textContent = 'Play';
    return;
  }

  // Determine what to play
  const isComposite = sourceVal === 'composite';
  const takeIdx = isComposite ? null : parseInt(sourceVal);

  // Need to load new audio?
  const needReload = !fullAudio ||
    (isComposite && !fullAudioIsComposite) ||
    (!isComposite && (fullAudioIsComposite || fullAudioTakeIdx !== takeIdx));

  if (needReload) {
    btn.textContent = 'Loading...';
    let resp;
    if (isComposite) {
      resp = await fetch('/api/export', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({crossfade_ms: 80}),
      });
    } else {
      resp = await fetch(`/api/audio/full/${takeIdx}`);
    }
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);

    if (fullAudio) { fullAudio.pause(); }
    fullAudio = new Audio(url);
    fullAudioTakeIdx = takeIdx;
    fullAudioIsComposite = isComposite;
    fullAudio.addEventListener('timeupdate', onPlaybackTimeUpdate);
    fullAudio.addEventListener('ended', () => {
      btn.textContent = 'Play';
      playingSeg = null;
      renderTimeline();
    });
  }

  fullAudio.play();
  btn.textContent = 'Pause';
}

function onPlaybackTimeUpdate() {
  if (!fullAudio) return;
  const slider = document.getElementById('playback-slider');
  const pos = document.getElementById('playback-position');
  const pct = (fullAudio.currentTime / fullAudio.duration) * 100;
  slider.value = pct;
  pos.textContent = `${formatTime(fullAudio.currentTime)} / ${formatTime(fullAudio.duration)}`;

  // For take playback, map time to segment.
  // For composite, time matches base take directly.
  const curTime = fullAudio.currentTime;
  const seg = project.segments.find(s => curTime >= s.start && curTime < s.end);
  const newPlayingSeg = seg ? seg.index : null;
  if (newPlayingSeg !== playingSeg) {
    playingSeg = newPlayingSeg;
    renderTimeline();
    // Auto-show detail but don't override manual selection
  }
}

document.getElementById('playback-slider').addEventListener('input', (e) => {
  if (fullAudio && fullAudio.duration) {
    fullAudio.currentTime = (e.target.value / 100) * fullAudio.duration;
  }
});

// Clicking a segment during playback seeks to it
function seekToSegment(idx) {
  if (fullAudio && !fullAudio.paused) {
    const seg = project.segments[idx];
    fullAudio.currentTime = seg.start;
  }
}

// --- Export ---
async function exportComposite() {
  const btn = document.querySelector('.btn-success');
  btn.textContent = 'Exporting...';
  btn.disabled = true;
  try {
    const resp = await fetch('/api/export', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({crossfade_ms: 80}),
    });
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'composite.wav'; a.click();
    URL.revokeObjectURL(url);
  } finally {
    btn.textContent = 'Export composite';
    btn.disabled = false;
  }
}

// --- Utilities ---
function formatTime(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

document.getElementById('threshold-slider').addEventListener('input', (e) => {
  document.getElementById('threshold-value').textContent = parseFloat(e.target.value).toFixed(2);
});

// --- Keyboard shortcuts ---
document.addEventListener('keydown', (e) => {
  // Don't capture if focus is on an input
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

  if (e.key === 'ArrowRight' && selectedSeg !== null && selectedSeg < project.segments.length - 1) {
    e.preventDefault();
    selectSegment(selectedSeg + 1, e.shiftKey);
  } else if (e.key === 'ArrowLeft' && selectedSeg !== null && selectedSeg > 0) {
    e.preventDefault();
    selectSegment(selectedSeg - 1, e.shiftKey);
  } else if (e.key === ' ') {
    e.preventDefault();
    if (selectedSeg !== null) {
      playRange(getSelectionStart(), getSelectionEnd(), project.base_idx);
    }
  } else if (e.key === 'Enter') {
    e.preventDefault();
    togglePlayback();
  }
});

loadProject();
</script>
